name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoparts
          POSTGRES_PASSWORD: autoparts
          POSTGRES_DB: autoparts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoparts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://autoparts:autoparts@localhost:5432/autoparts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Migrar banco de testes
        run: npm run db:migrate

      - name: Testes
        run: npm run test
